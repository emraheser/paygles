services:
  backend:
    build: ./backend
    ports:
      - "8000:8080"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - SQLITE_PATH=/data/paygles.db
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - backend_sqlite:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_sqlite:
